# settings.toml — 项目级配置，可安全提交到 git
# 敏感信息（API Key）请写在 .secrets.toml，不要写在这里

[default]
# ── 模型默认值 ──────────────────────────────────────────────
default_model   = "gpt-4o-mini"
openai_api_base = "https://openrouter.ai/api/v1"            # 留空 = 使用 OpenAI 官方端点
OPENAI_API_BASE="https://openrouter.ai/api/v1"

# ── 前端表单默认值（模型与参数）────────────────────────────
# 分析模型（用于 experimenting / related_work 等文本分析任务）
text_model_name     = "claude-sonnet-4-6"
# 写作模型（用于 method_writing / introduction 等写作任务）
write_model_name    = "claude-sonnet-4-6"
# 嵌入模型
embedding_model         = "BAAI/bge-m3"
embedding_model_source  = "api"
# 重排模型
reranker_path           = "BAAI/bge-reranker-v2-m3"
reranker_model_source   = "api"
# PDF 解析模式：api | local
pdf_transform_mode      = "api"
# 向量数据库设备
database_device         = "cpu"

# ── 运行参数默认值（StartRunRequest）─────────────────────────
sandbox_timeout         = 300
beam_width              = 3
consecutive_bad_limit   = 3
max_generations         = 50
pop_size                = 10
mutation_rate           = 0.3
max_fe                  = 5000
existing_direction      = "maximize"
expand_references       = true
all_paper_num           = 70

# ── 请求默认值 ──────────────────────────────────────────────
default_timeout     = 30.0
default_max_retries = 2

# ── LLM 配置预设（configs/*.json 中用 "preset": "名称" 引用）───
# config JSON 中写的字段会覆盖 preset 中的同名字段
[default.presets.default]
# 标准配置：适用于大多数 JSON 输出任务（34/61 个 config 使用）
model           = "gpt-4.1-mini"
json_output     = true
use_instructor  = false
enable_history  = false
timeout         = 120.0
max_retries     = 3
params          = { temperature = 0.7 }

[default.presets.fast]
# 快速配置：短超时、低温度、限制 token，适用于分类/提取等简单任务
model           = "gpt-4.1-mini"
json_output     = true
use_instructor  = false
enable_history  = false
timeout         = 60.0
max_retries     = 3
params          = { temperature = 0.2, max_tokens = 4096 }

[default.presets.strong]
# 强模型配置：复杂推理任务（代码生成、架构设计等）
model           = "gpt-4.1"
json_output     = true
use_instructor  = false
enable_history  = false
timeout         = 120.0
max_retries     = 3
params          = { temperature = 0.7 }

[default.presets.creative]
# 创意配置：高温度、文本输出，适用于变异/交叉等需要多样性的任务
model           = "gpt-4.1"
json_output     = false
use_instructor  = false
enable_history  = false
timeout         = 60.0
max_retries     = 2
params          = { temperature = 0.8, max_tokens = 2048 }

# ── 日志 ────────────────────────────────────────────────────
log_level = "INFO"
log_dir   = ""       # 日志文件目录，空字符串则使用项目根目录下 logs/
log_json  = false    # 控制台是否输出 JSON 格式（生产环境推荐 true）


[development]
# 开发环境：复用 default，无需额外覆盖
default_model = "gpt-4o-mini"
log_level     = "DEBUG"
OPENAI_API_BASE="https://openrouter.ai/api/v1"

[production]
# 生产环境：使用更强的模型，更长超时
default_model       = "gpt-4o"
default_timeout     = 60.0
default_max_retries = 3
log_level           = "INFO"
log_json            = true
OPENAI_API_BASE="https://openrouter.ai/api/v1"

[vllm]
# 本地 vLLM 部署环境
openai_api_base     = "http://localhost:45998/v1"
openai_api_key      = "EMPTY"              # vLLM 不需要真实 key
default_model       = "/workspace/MiniMax-M2.5"
default_timeout     = 120.0
default_max_retries = 1
