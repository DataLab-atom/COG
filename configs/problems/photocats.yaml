# 对应 BRIEF_DATASET_DESCRIPTION
brief_dataset_description: |
  ## Dataset Structure   
  - Columns:
    1. **ID**: Sample index  
    2. **CAS**: Chemical Abstracts Service registry number  
    3. **SMILES**: Molecular SMILES string  
    4. **HER**: Measured hydrogen evolution rate (target)  
    5. **EA***: Electron affinity in the first excited state (TD-DFT)  
    6. **EA**: Electron affinity in the ground state (DFT)  
    7. **Sr**: Hole–electron overlap index (0 to 1)  
    8. **Δσ**: Difference in spatial spread (sparsity) of electron vs. hole  
    9. **H_CT**: Average distribution width along the charge-transfer axis  
    10. **ΔD**: Change in dipole moment (excited minus ground state)  
    11. **E_eb**: Exciton binding energy = EA* – EA  
    12. **E_sol**: Solvation energy = E<sub>solvent</sub> – E<sub>gas</sub>  
    13. **E_b**: Dimerization binding energy = E<sub>dimer</sub> – 2·E<sub>monomer</sub>  
    14. **S1-S0**: Vertical S₁–S₀ optical gap (first singlet excitation)  
    15. **S1-T1**: Singlet–triplet gap (intersystem‐crossing propensity)  
    ```

# 对应 DEMAND 
demand: |
  ```markdown
  Design a system that utilizes the given 11 computed molecular descriptors to discover explicit mathematical formulas related to the target property — hydrogen release performance (HER) of organic molecules — through symbolic regression.

  # Requirements:
  - No need to design visualization or reporting modules.
  - The symbolic regression algorithm must be implemented manually; do not directly call existing libraries or pre-made algorithms.
  - The depth should not be overly deep.
  - Wrap every mathematical operator in a robust function to handle invalid inputs, and ensure the fitness function penalizes any unstable results.
  
    *   **Data Example**:
        ```csv
        ID,CAS,SMILES,HER,EA*,EA,Sr,Δσ,H_CT,ΔD,E_eb,E_sol,E_b,S1-S0,S1-T1
        1, 2144-08-3,O=Cc1ccc(O)c(O)c1O,0,0.958740415,-2.932459585,0.481,0.711,1.412,2.3943,1.221483537,-0.399406019,-0.494217733,3.8912,0.597741266
        ```
  ```
