# ==========================================
# 问题基本元数据
# ==========================================
name: "single_cell"
metric: |
  Use mean Local Inverse Simpson's Index (mLISI) as the primary metric.
  mLISI measures how well synthetic single-cell data mixes with real test data in a shared
  embedding space: higher values indicate better integration and realism.
  The function should return {"mlisi": float}.
  Higher values are better; a value near the theoretical maximum indicates ideal mixing.

# ==========================================
# 路径配置 (相对于项目根目录)
# ==========================================
# 对应 DATASET_PATH
dataset_path: "problems/single_cell/datasets/ATAC_sce_train.rds"

# ==========================================
# 描述与需求 (Prompt)
# ==========================================
# 对应 BRIEF_DATASET_DESCRIPTION
brief_dataset_description: |
  **Domain & Purpose**: This is a **scATAC-seq** dataset from the field of **Single-cell Epigenomics**. It profiles chromatin accessibility in Human Peripheral Blood Mononuclear Cells (**PBMCs**) to investigate the cell-type-specific regulatory landscape at single-cell resolution.
  *   **Data Scale**:
      *   **Features**: 1,133 selected genomic peaks (Differentially Accessible Regions).
      *   **Cells**: 7,034 individual cells.(total in train and test datasets)
  *   **Format & Values**:
      *   **Count Matrix**: An integer matrix where values represent the number of DNA fragments captured at specific genomic loci.
      *   **Metadata**: 31 columns of detailed information, including QC metrics (TSS enrichment, nucleosome signal, fragment counts) and biological labels (`cell_type`, e.g., CD14 Mono, NK CD56Dim).

# 对应 DEMAND 
demand: |
  **Task Objective: Implementation of a High-Fidelity Single-Cell Data Simulator**

  **1. Data Context**
  The dataset has been pre-split into a training set and a test set, located at: `problems/single_cell/datasets/`. The files are `ATAC_sce_train.rds` and `ATAC_sce_test.rds`. This is a scATAC-seq dataset where features represent genomic peaks and samples represent individual cells.

  **2. Core Requirements**
  *   **Model Training**: Learn the biological variations and statistical distributions from the `counts` matrix and the `cell_type` labels of the training set (`ATAC_sce_train.rds`).
  *   **Data Generation**: Simulate a synthetic single-cell dataset that is structurally and format-consistent with the original `SingleCellExperiment` object (maintaining identical dimensions, row/column naming conventions, and metadata attributes).
  *   **Performance Evaluation**: Use the provided script to calculate the **mLISI** metric between the generated synthetic data and the held-out test set (`ATAC_sce_test.rds`) to evaluate the simulation's realism and mixing degree.

  **3. Data Interface**
  The datasets are stored as R `SingleCellExperiment` (SCE) objects. Use the following Python code snippet to get the information of datasets:

  ```python
  import rpy2.robjects as ro
  from rpy2.robjects import pandas2ri
  from rpy2.robjects.conversion import localconverter
  import numpy as np

  rds_file = "/root/dataset/data/ATAC_sce.rds"
  sce = ro.r('suppressMessages(readRDS("%s"))' % rds_file)

  try:
      # 安全地获取 colData
      with localconverter(ro.default_converter + pandas2ri.converter):
          coldata = ro.conversion.rpy2py(ro.r['as.data.frame'](ro.r['colData'](sce)))
          print("=== colData (first 3 rows) ===")
          print(coldata.head(3).to_string())
          
      # 获取可用的 assay 名称
      assay_names = list(ro.r['assayNames'](sce))
      print(f"\nAvailable assays: {assay_names}")
      
      # 获取第一个可用的 assay
      if assay_names:
          # 使用 R 函数获取 assay，而不是 rx2
          counts_r = ro.r['as.matrix'](ro.r['assay'](sce, assay_names[0]))
          with localconverter(ro.default_converter + pandas2ri.converter):
              counts = ro.conversion.rpy2py(counts_r)
              if not isinstance(counts, np.ndarray):
                  counts = np.array(counts)
              print(f"\n=== {assay_names[0]} matrix shape: {counts.shape} ===")
              print(counts[:5, :5])
      
      # 获取基因名和细胞名
      genes = list(ro.r['rownames'](sce))
      cells = list(ro.r['colnames'](sce))
      print(f"\nFirst 5 genes: {genes[:5]}")
      print(f"First 5 cells: {cells[:5]}")
      
  except Exception as e:
      print(f"Error: {e}")
      # 调试信息
      print(f"Object type: {type(sce)}")
      print(f"R class: {list(ro.r('class')(sce))}")
  ```
