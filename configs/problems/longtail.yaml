# 对应 DEMAND 
demand: |
  ```markdown
  **Project Phase 1: Data-Driven Strategy Design & Molecular Classification**

  Please use **PyTorch** to implement the first phase of a research project. The goal is to design a machine learning system that generalizes across modalities, starting with molecular data.

  ### 1. Data Analysis & Preparation (Zinc-Fluor)
  *   **Input**: Load the Zinc-Fluor dataset (CSV). Features: `SMILES` string; Label: `color_value`.
  *   **Feature Engineering**:
      *   Analyze the data format (SMILES). Design a preprocessing pipeline to convert these strings into a **sequence format** suitable for deep learning.
  *   **Distribution Analysis**:
      *   Analyze the class distribution of the training set. It is expected to be **highly imbalanced (Long-Tail)**.
      *   *Requirement*: Based on this imbalance, you must explicitly **design a Strategy Component** to prevent the model from being biased towards the majority class.

  ### 2. Model Architecture Design
  *   **Objective**: Design a **High-Performance Sequence Model** capable of processing the SMILES sequences.
  *   **Design Constraints**:
      *   The architecture should be modern and capable of capturing long-range dependencies in molecules.
      *   It must be designed as a **general-purpose sequence encoder**, avoiding hard-coded logic specific only to chemistry, to facilitate future cross-modal reuse.

  ### 3. Execution
  *   Train the designed model using your designed imbalance strategy on the Zinc-Fluor training set.
  *   **Metric**: Print the **Per Class Accuracy** on the test set. (This is the critical metric to verify if your strategy successfully handled the tail classes).

  2.  **Technical & Output Specifications**:
          *   Molecular Data: Input feature is `SMILES`, label is `color_value`.
      *   **Evaluation Metrics**:
          *   After training, output the **Per Class Accuracy** on the test set for both tasks to verify the consistent effectiveness of the strategy across different data sources.
      *   **Data Example**:
          ```csv
          index,SMILES,pred_fluor_colour,intensity,color_value
          ZINC000033037009,CC(=O)Nc1c(-c2ccccc2)c(C)nn1-c1ccc(C(=O)Nc2cccnc2)cc1,Ultraviolet,Very Weak,1
          ```
  ```
